[package]
name = "sunshine-stream-apps-manager"
version = "0.1.0"
edition = "2021"
description = "A modular application that integrates with Sunshine stream manager to read game libraries from multiple services"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# SSH
ssh2 = "0.9"

# UUID
uuid = { version = "1.11", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Glob pattern matching
glob = "0.3"

# Regex
regex = "1.10"

# Home/config directories
dirs = "5.0"

# Lazy static initialization
once_cell = "1.20"
