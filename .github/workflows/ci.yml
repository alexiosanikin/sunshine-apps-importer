name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux builds ────────────────────────────────────────────────
  build-linux:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x86_64
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          rustup target add ${{ matrix.target }}
          RUSTFLAGS="-C link-arg=-s" \
          cargo build --release --target ${{ matrix.target }}

      - name: Build aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/volume \
            -w /volume \
            ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main \
            cargo build --release --target aarch64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-linux-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'x86_64' || 'aarch64' }}
          path: target/${{ matrix.target }}/release/sunshine-stream-apps-manager
          retention-days: 7

  # ── macOS builds ────────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: |
          OPENSSL_DIR="$(brew --prefix openssl@3)" \
          OPENSSL_LIB_DIR="$(brew --prefix openssl@3)/lib" \
          OPENSSL_INCLUDE_DIR="$(brew --prefix openssl@3)/include" \
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig" \
          PKG_CONFIG_ALLOW_CROSS=1 \
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-macos-${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'aarch64' }}
          path: target/${{ matrix.target }}/release/sunshine-stream-apps-manager
          retention-days: 7

  # ── Windows builds ──────────────────────────────────────────────
  build-windows:
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows-${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x86_64' || 'aarch64' }}
          path: target/${{ matrix.target }}/release/sunshine-stream-apps-manager.exe
          retention-days: 7

  # ── Run tests ───────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test --all

  # ── Lint & format check ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clippy and rustfmt
        run: rustup component add clippy rustfmt

      - name: Run fmt check
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all -- -D warnings
